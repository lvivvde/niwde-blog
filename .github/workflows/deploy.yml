name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niwde-blog-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site, search index, and verify output
        run: npm run build
        env:
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - name: Sign release manifest
        env:
          DEPLOY_SIGNING_KEY_B64: ${{ secrets.DEPLOY_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          signing_key="$RUNNER_TEMP/niwde-blog-signing-key"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s' "$DEPLOY_SIGNING_KEY_B64" | base64 -d > "$signing_key"
          chmod 600 "$signing_key"
          (
            cd dist
            find . -type f \
              ! -name '.manifest.sha256' \
              ! -name '.manifest.sha256.sig' \
              -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > .manifest.sha256
          )
          ssh-keygen -Y sign -q -f "$signing_key" -n niwde-blog dist/.manifest.sha256

      # The VPS no longer accepts inbound SSH from the public internet.
      # Instead it pulls this signed bundle over HTTPS from a systemd timer
      # (niwde-blog-sync). The signature produced above is what makes the
      # pull path trustworthy: activate-niwde-blog verifies it on the VPS
      # before the release is switched live.
      - name: Publish deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > dist/.deploy-sha
          tar -czf dist.tar.gz -C dist .
          if gh release view deploy-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload deploy-latest dist.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create deploy-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Deployment bundle (rolling)" \
              --notes "Rolling bundle consumed by the VPS pull deployer. Source commit: $GITHUB_SHA" \
              dist.tar.gz
          fi
