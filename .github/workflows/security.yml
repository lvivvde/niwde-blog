name: Security and availability checks

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Rebuild from lockfile
        run: npm ci && npm run build

  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public endpoints and expected content
        shell: bash
        run: |
          set -euo pipefail
          # Download first, then assert. Piping curl into `grep -q` lets grep exit on
          # its first match and close the pipe, so curl dies writing the rest of the
          # body (exit 23) and pipefail fails the job.
          body="$RUNNER_TEMP/http-body"
          check() {
            curl --fail --silent --show-error --location --max-time 20 -o "$body" "$1"
            grep -Fq "$2" "$body"
            echo "ok: $1 contains $2"
          }
          check https://yangjiexin.com/ 'Niwde'
          check https://yangjiexin.com/search/ '搜索'
          check https://yangjiexin.com/rss.xml '<rss'
